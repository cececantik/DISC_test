<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pertanyaan Tes - DISC Test</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
      }
      .brand-purple {
        color: #6D28D9;
      }
      .bg-brand-purple {
        background-color: #6D28D9;
      }
      .bg-brand-purple:hover {
        background-color: #5B21B6;
      }
    </style>
  </head>

  <body class="bg-slate-100 min-h-screen flex items-center justify-center p-0 sm:p-4 text-slate-800">
    <!-- Main Mobile Container -->
    <div
      class="w-full max-w-md min-h-screen sm:min-h-[660px] sm:h-auto bg-white sm:rounded-3xl shadow-xl sm:border sm:border-slate-100 px-6 py-6 flex flex-col justify-between"
    >
      <!-- Top Section -->
      <div>
        <!-- Header: Back Button & Progress Bar -->
        <div class="flex items-center justify-between">
          <button
            id="btnBack"
            aria-label="Kembali"
            class="p-2 -ml-2 rounded-xl text-slate-700 hover:bg-slate-100 active:scale-95 transition cursor-pointer"
          >
            <svg
              class="w-6 h-6"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
          </button>

          <span
            id="questionCounter"
            class="text-xs font-bold text-purple-700 bg-purple-50 px-3 py-1 rounded-full border border-purple-100"
          >
            Memuat soal...
          </span>
        </div>

        <!-- Progress Bar Indicator -->
        <div class="w-full bg-slate-100 h-1.5 rounded-full mt-4 overflow-hidden">
          <div
            id="progressBar"
            class="bg-[#6D28D9] h-full rounded-full transition-all duration-300"
            style="width: 0%"
          ></div>
        </div>

        <!-- Question Title & Instruction -->
        <div class="mt-6">
          <h2
            id="questionTitle"
            class="text-base sm:text-lg font-extrabold text-slate-900 leading-snug"
          >
            Kotak Soal
          </h2>
          <p class="text-xs text-slate-500 mt-1">
            Pilih 1 pernyataan yang <strong class="text-purple-700">Paling Sesuai (Most/+)</strong> dan 1 yang <strong class="text-slate-700">Paling Tidak Sesuai (Least/-)</strong>:
          </p>
        </div>

        <!-- Options Container for Current Question -->
        <div class="mt-4 space-y-3" id="optionsContainer">
          <!-- Dinamis diisi via JavaScript -->
        </div>
      </div>

      <!-- Bottom Action Section -->
      <div class="pt-6 pb-2">
        <button
          type="button"
          id="btnNext"
          class="w-full bg-[#6D28D9] hover:bg-[#5B21B6] text-white font-bold py-3.5 px-6 rounded-xl shadow-lg shadow-purple-200 transition-all duration-200 active:scale-[0.98] flex items-center justify-center text-center cursor-pointer"
        >
          Selanjutnya
        </button>
      </div>
    </div>

    <!-- Alert / Toast Modal -->
    <div
      id="toastAlert"
      class="fixed bottom-6 inset-x-4 max-w-sm mx-auto bg-slate-900 text-white text-xs px-4 py-3 rounded-xl shadow-xl flex items-center gap-3 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none z-50"
    >
      <span>⚠️</span>
      <span id="toastMsg">Harap pilih Most dan Least terlebih dahulu.</span>
    </div>

    <!-- Script Integrasi Backend & Logika Soal DISC -->
    <script>
      const API_URL = 'http://localhost:3000/api';
      let questionsData = [];
      let currentIndex = 0;
      let userAnswers = {}; // Menyimpan jawaban per question.id: { most, least }

      const questionCounter = document.getElementById('questionCounter');
      const progressBar = document.getElementById('progressBar');
      const questionTitle = document.getElementById('questionTitle');
      const optionsContainer = document.getElementById('optionsContainer');
      const btnNext = document.getElementById('btnNext');
      const btnBack = document.getElementById('btnBack');
      const toastAlert = document.getElementById('toastAlert');
      const toastMsg = document.getElementById('toastMsg');

      function showToast(msg) {
        toastMsg.textContent = msg;
        toastAlert.classList.remove('translate-y-20', 'opacity-0');
        setTimeout(() => {
          toastAlert.classList.add('translate-y-20', 'opacity-0');
        }, 2500);
      }

      // 1. Ambil Data Soal dari Backend (/api/questions)
      async function fetchQuestions() {
        try {
          const res = await fetch(`${API_URL}/questions`);
          const result = await res.json();
          if (result.success) {
            questionsData = result.data;
            renderQuestion(currentIndex);
          } else {
            showToast('Gagal memuat soal dari server.');
          }
        } catch (err) {
          console.error('Error fetching questions:', err);
          showToast('Tidak dapat terhubung ke server backend.');
        }
      }

      // 2. Render Soal & Opsi Berdasarkan Indeks Saat Ini
      function renderQuestion(index) {
        if (questionsData.length === 0) return;

        const q = questionsData[index];
        questionCounter.textContent = `Kotak ${q.nomor} dari ${questionsData.length}`;
        const progressPct = ((index + 1) / questionsData.length) * 100;
        progressBar.style.width = `${progressPct}%`;
        questionTitle.textContent = `Soal Pilihan ${q.nomor}`;

        optionsContainer.innerHTML = '';

        // Ambil jawaban sebelumnya jika ada (menggunakan q.id dari database)
        const currentAnswer = userAnswers[q.id] || { most: null, least: null };

        q.options.forEach((opt) => {
          const isMostChecked = currentAnswer.most === opt.id ? 'checked' : '';
          const isLeastChecked = currentAnswer.least === opt.id ? 'checked' : '';
          
          // Nonaktifkan opsi yang bersilangan dalam satu baris
          const isMostDisabled = currentAnswer.least === opt.id;
          const isLeastDisabled = currentAnswer.most === opt.id;

          optionsContainer.innerHTML += `
            <div class="p-3 border-2 border-slate-200 rounded-2xl bg-white flex items-center justify-between gap-2">
              <span class="text-xs sm:text-sm font-medium text-slate-800 flex-1">${opt.teks}</span>
              <div class="flex items-center gap-4 shrink-0">
                <!-- Most Radio -->
                <label class="flex items-center gap-1 cursor-pointer select-none">
                  <span class="text-[10px] font-bold text-purple-700">Most</span>
                  <input type="radio" name="most_option" value="${opt.id}" ${isMostChecked} ${isMostDisabled ? 'disabled' : ''}
                         onchange="handleSelection(${q.id}, ${opt.id}, 'most')" class="w-4 h-4 text-purple-600 cursor-pointer">
                </label>
                <!-- Least Radio -->
                <label class="flex items-center gap-1 cursor-pointer select-none">
                  <span class="text-[10px] font-bold text-slate-500">Least</span>
                  <input type="radio" name="least_option" value="${opt.id}" ${isLeastChecked} ${isLeastDisabled ? 'disabled' : ''}
                         onchange="handleSelection(${q.id}, ${opt.id}, 'least')" class="w-4 h-4 text-slate-600 cursor-pointer">
                </label>
              </div>
            </div>
          `;
        });

        if (index === questionsData.length - 1) {
          btnNext.textContent = 'Review & Selesaikan Tes';
        } else {
          btnNext.textContent = 'Selanjutnya';
        }
      }

      // 3. Logika Aturan DISC (Most & Least tidak boleh di baris yang sama)
      function handleSelection(questionId, optionId, type) {
        if (!userAnswers[questionId]) {
          userAnswers[questionId] = { most: null, least: null };
        }

        if (type === 'most') {
          userAnswers[questionId].most = optionId;
          if (userAnswers[questionId].least === optionId) {
            userAnswers[questionId].least = null; // Reset least jika baris sama
          }
        } else {
          userAnswers[questionId].least = optionId;
          if (userAnswers[questionId].most === optionId) {
            userAnswers[questionId].most = null; // Reset most jika baris sama
          }
        }

        renderQuestion(currentIndex);
      }

      // 4. Tombol Kembali
      btnBack.addEventListener('click', () => {
        if (currentIndex > 0) {
          currentIndex--;
          renderQuestion(currentIndex);
        } else {
          window.location.href = 'data-diri.html';
        }
      });

      // 5. Tombol Selanjutnya & Kirim ke Backend saat Soal Terakhir
      btnNext.addEventListener('click', async () => {
        const q = questionsData[currentIndex];
        const currentAnswer = userAnswers[q.id];

        if (!currentAnswer || !currentAnswer.most || !currentAnswer.least) {
          showToast(`Harap pilih 1 Most (+) dan 1 Least (-) pada Kotak ${q.nomor}.`);
          return;
        }

        if (currentIndex < questionsData.length - 1) {
          currentIndex++;
          renderQuestion(currentIndex);
        } else {
          // Format data jawaban untuk dikirim ke POST /api/submit-test
          const formattedAnswersArray = Object.keys(userAnswers).map((qId) => ({
            question_id: parseInt(qId),
            most_option_id: userAnswers[qId].most,
            least_option_id: userAnswers[qId].least
          }));

          const attemptId = localStorage.getItem('attempt_id') || 1; // Default 1 jika testing mandiri

          try {
            btnNext.disabled = true;
            btnNext.textContent = 'Memproses...';

            const response = await fetch(`${API_URL}/submit-test`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ 
                attempt_id: parseInt(attemptId), 
                answers: formattedAnswersArray 
              })
            });

            const result = await response.json();
            if (result.success) {
              localStorage.setItem('disc_result', JSON.stringify(result));
              window.location.href = 'review.html'; // Atau arahkan langsung ke halaman hasil
            } else {
              showToast('Gagal mengirim jawaban: ' + result.message);
              btnNext.disabled = false;
              btnNext.textContent = 'Review & Selesaikan Tes';
            }
          } catch (err) {
            console.error(err);
            showToast('Terjadi kesalahan koneksi ke server.');
            btnNext.disabled = false;
            btnNext.textContent = 'Review & Selesaikan Tes';
          }
        }
      });

      // Jalankan pemanggilan soal saat halaman dimuat
      fetchQuestions();
    </script>
  </body>
</html>
