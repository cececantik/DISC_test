<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Daftar Peserta Tes DISC</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
      }
      .type-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 2rem;
        height: 2rem;
        border-radius: 9999px;
        font-weight: 800;
        font-size: 0.8rem;
        color: #fff;
      }
      .type-D { background-color: #dc2626; }
      .type-I { background-color: #f59e0b; }
      .type-S { background-color: #10b981; }
      .type-C { background-color: #3b82f6; }
    </style>
  </head>

  <body class="bg-slate-100 min-h-screen text-slate-800">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-8">
      <!-- Header -->
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
        <div>
          <span
            class="text-xs font-bold text-purple-700 bg-purple-50 px-3 py-1 rounded-full border border-purple-100"
          >
            Admin Panel
          </span>
          <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 mt-3">
            Data Peserta Tes DISC
          </h1>
          <p class="text-sm text-slate-500 mt-1">
            Daftar peserta yang sudah menyelesaikan tes DISC.
          </p>
        </div>

        <!-- Search -->
        <div class="w-full sm:w-72">
          <div class="relative">
            <svg
              class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z"
              />
            </svg>
            <input
              id="searchInput"
              type="text"
              placeholder="Cari nama peserta..."
              class="w-full pl-9 pr-3 py-2.5 text-sm rounded-xl border border-slate-200 bg-white focus:outline-none focus:ring-2 focus:ring-purple-200 focus:border-purple-400"
            />
          </div>
        </div>
      </div>

      <!-- Card -->
      <div class="bg-white border border-slate-100 rounded-2xl shadow-sm overflow-hidden">
        <!-- Loading State -->
        <div id="loadingState" class="py-16 text-center">
          <div
            class="inline-block w-8 h-8 border-4 border-purple-600 border-t-transparent rounded-full animate-spin"
          ></div>
          <p class="text-xs text-slate-400 mt-3">Memuat data peserta...</p>
        </div>

        <!-- Error State -->
        <div id="errorState" class="hidden py-16 text-center px-6">
          <p class="text-sm text-red-500 font-semibold">
            Gagal memuat data peserta.
          </p>
          <p class="text-xs text-slate-400 mt-1">
            Pastikan server backend sedang berjalan.
          </p>
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden py-16 text-center px-6">
          <p class="text-sm text-slate-500 font-semibold">
            Belum ada peserta yang menyelesaikan tes.
          </p>
        </div>

        <!-- Table -->
        <div id="tableWrapper" class="hidden overflow-x-auto">
          <table class="w-full text-sm">
            <thead>
              <tr class="bg-slate-50 text-slate-500 text-xs font-bold uppercase tracking-wider text-left">
                <th class="px-5 py-3">Nama Lengkap</th>
                <th class="px-5 py-3">Umur</th>
                <th class="px-5 py-3">Pekerjaan</th>
                <th class="px-5 py-3">Jenis Kelamin</th>
                <th class="px-5 py-3">Tanggal Tes</th>
                <th class="px-5 py-3 text-center">Tipe Dominan</th>
                <th class="px-5 py-3 text-right">Aksi</th>
              </tr>
            </thead>
            <tbody id="tableBody" class="divide-y divide-slate-100"></tbody>
          </table>
        </div>

        <!-- Pagination Footer -->
        <div
          id="paginationFooter"
          class="hidden flex flex-col sm:flex-row items-center justify-between gap-3 px-5 py-4 border-t border-slate-100"
        >
          <p id="paginationInfo" class="text-xs text-slate-500"></p>
          <div class="flex items-center gap-2">
            <button
              id="btnPrev"
              type="button"
              class="px-3 py-1.5 text-xs font-semibold rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-50 disabled:opacity-40 disabled:cursor-not-allowed"
            >
              &larr; Sebelumnya
            </button>
            <span id="pageIndicator" class="text-xs font-bold text-slate-700 px-2"></span>
            <button
              id="btnNext"
              type="button"
              class="px-3 py-1.5 text-xs font-semibold rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-50 disabled:opacity-40 disabled:cursor-not-allowed"
            >
              Berikutnya &rarr;
            </button>
          </div>
        </div>
      </div>
    </div>

    <script>
      const API_URL = "http://localhost:3000/api";
      const LIMIT = 10;

      let currentPage = 1;
      let currentSearch = "";
      let searchDebounce;

      const loadingState = document.getElementById("loadingState");
      const errorState = document.getElementById("errorState");
      const emptyState = document.getElementById("emptyState");
      const tableWrapper = document.getElementById("tableWrapper");
      const tableBody = document.getElementById("tableBody");
      const paginationFooter = document.getElementById("paginationFooter");
      const paginationInfo = document.getElementById("paginationInfo");
      const pageIndicator = document.getElementById("pageIndicator");
      const btnPrev = document.getElementById("btnPrev");
      const btnNext = document.getElementById("btnNext");
      const searchInput = document.getElementById("searchInput");

      function showOnly(el) {
        [loadingState, errorState, emptyState, tableWrapper].forEach((e) =>
          e.classList.add("hidden"),
        );
        el.classList.remove("hidden");
      }

      function formatTanggal(dateStr) {
        if (!dateStr) return "-";
        const d = new Date(dateStr);
        return d.toLocaleDateString("id-ID", {
          day: "2-digit",
          month: "short",
          year: "numeric",
        });
      }

      function renderRows(data) {
        tableBody.innerHTML = data
          .map(
            (p) => `
          <tr class="hover:bg-slate-50 transition-colors">
            <td class="px-5 py-3 font-semibold text-slate-900">${p.nama_lengkap ?? "-"}</td>
            <td class="px-5 py-3 text-slate-600">${p.umur ?? "-"}</td>
            <td class="px-5 py-3 text-slate-600">${p.pekerjaan ?? "-"}</td>
            <td class="px-5 py-3 text-slate-600">${p.jenis_kelamin ?? "-"}</td>
            <td class="px-5 py-3 text-slate-600">${formatTanggal(p.tanggal_tes)}</td>
            <td class="px-5 py-3 text-center">
              <span class="type-badge type-${p.dominant_type}">${p.dominant_type ?? "-"}</span>
            </td>
            <td class="px-5 py-3 text-right">
              <a
                href="admin-detail.html?attempt_id=${p.attempt_id}"
                class="inline-flex items-center gap-1 text-xs font-bold text-purple-700 bg-purple-50 hover:bg-purple-100 px-3 py-1.5 rounded-lg transition-colors"
              >
                Lihat Detail
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" />
                </svg>
              </a>
            </td>
          </tr>
        `,
          )
          .join("");
      }

      async function loadParticipants() {
        showOnly(loadingState);
        paginationFooter.classList.add("hidden");

        try {
          const params = new URLSearchParams({
            page: currentPage,
            limit: LIMIT,
          });
          if (currentSearch) params.set("search", currentSearch);

          const res = await fetch(`${API_URL}/admin/participants?${params.toString()}`);
          const result = await res.json();

          if (!res.ok || !result.success) {
            showOnly(errorState);
            return;
          }

          const { data, pagination } = result;

          if (!data || data.length === 0) {
            showOnly(emptyState);
            return;
          }

          renderRows(data);
          showOnly(tableWrapper);

          // Pagination footer
          paginationFooter.classList.remove("hidden");
          const start = (pagination.page - 1) * pagination.limit + 1;
          const end = Math.min(pagination.page * pagination.limit, pagination.total);
          paginationInfo.textContent = `Menampilkan ${start}-${end} dari ${pagination.total} peserta`;
          pageIndicator.textContent = `Hal. ${pagination.page} / ${pagination.total_pages}`;
          btnPrev.disabled = pagination.page <= 1;
          btnNext.disabled = pagination.page >= pagination.total_pages;

          currentPage = pagination.page;
        } catch (err) {
          console.error("Gagal memuat daftar peserta:", err);
          showOnly(errorState);
        }
      }

      btnPrev.addEventListener("click", () => {
        if (currentPage > 1) {
          currentPage -= 1;
          loadParticipants();
        }
      });

      btnNext.addEventListener("click", () => {
        currentPage += 1;
        loadParticipants();
      });

      searchInput.addEventListener("input", (e) => {
        clearTimeout(searchDebounce);
        searchDebounce = setTimeout(() => {
          currentSearch = e.target.value.trim();
          currentPage = 1;
          loadParticipants();
        }, 350);
      });

      window.addEventListener("DOMContentLoaded", loadParticipants);
    </script>
  </body>
</html>
